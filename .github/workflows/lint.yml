name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cfn-lint:
    name: cfn-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - name: Lint CloudFormation templates
        run: |
          shopt -s nullglob
          templates=(iac/cloudformation/*.yaml iac/cloudformation/*.yml)
          if [ ${#templates[@]} -eq 0 ]; then
            echo "No CloudFormation templates yet (Week 0) — skipping."
          else
            cfn-lint "${templates[@]}"
          fi
